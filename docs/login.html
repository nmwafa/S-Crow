<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - S+CROW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus+Jakarta+Sans', sans-serif; }
        .bg-scrow-green { background-color: #15803d; }
        .text-scrow-green { color: #15803d; }
        .bg-scrow-yellow { background-color: #facc15; }
        .text-scrow-yellow { color: #facc15; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header / Nav Sederhana -->
    <nav class="p-6">
        <a href="index.html" class="flex items-center space-x-2 max-w-7xl mx-auto">
            <div class="w-8 h-8 bg-scrow-green rounded flex items-center justify-center">
                <span class="text-scrow-yellow font-bold text-sm">S+</span>
            </div>
            <span class="text-xl font-bold tracking-tighter text-scrow-green">CROW</span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        
        <!-- Langkah 1: Pemilihan Peran -->
        <div id="selection" class="sub-page active w-full max-w-4xl text-center">
            <h1 class="text-3xl font-bold mb-2">Selamat Datang Kembali</h1>
            <p class="text-gray-500 mb-12">Pilih tipe akun Anda untuk masuk ke sistem</p>
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Opsi Supplier -->
                <button onclick="showLogin('supplier')" class="bg-white p-10 rounded-3xl shadow-sm border-2 border-transparent hover:border-scrow-green transition group text-left">
                    <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center text-scrow-green text-3xl mb-6 group-hover:scale-110 transition">
                        <i class="fas fa-warehouse"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Supplier</h3>
                    <p class="text-gray-500">Masuk untuk mengelola stok, inventaris, dan pesanan masuk.</p>
                </button>
                <!-- Opsi Buyer -->
                <button onclick="showLogin('buyer')" class="bg-white p-10 rounded-3xl shadow-sm border-2 border-transparent hover:border-scrow-yellow transition group text-left">
                    <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center text-scrow-yellow text-3xl mb-6 group-hover:scale-110 transition">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Buyer</h3>
                    <p class="text-gray-500">Masuk untuk mencari produk bahan baku dan melacak pengiriman.</p>
                </button>
            </div>
            <div class="mt-12">
                <p class="text-gray-500">Belum memiliki akun bisnis? <a href="register.html" class="text-scrow-green font-bold hover:underline">Daftar sekarang</a></p>
            </div>
        </div>

        <!-- Langkah 2a: Form Login Supplier -->
        <div id="supplier-form" class="sub-page w-full max-w-md">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                <button onclick="showSelection()" class="text-gray-400 hover:text-gray-600 mb-6 flex items-center text-sm transition">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali ke pemilihan
                </button>
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-scrow-green text-white rounded-xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-green-100">
                        <i class="fas fa-warehouse"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Masuk Supplier</h2>
                    <p class="text-sm text-gray-400 mt-1">Kelola rantai pasok Anda</p>
                </div>
                <!-- Redirect ke dashboard-supplier.html -->
                <form onsubmit="event.preventDefault(); window.location.href='dashboard-supplier.html'" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">ID Mitra / Email Bisnis</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-scrow-green focus:ring-4 focus:ring-green-50 transition" placeholder="SUP-12345" required>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-bold text-gray-700">Kata Sandi</label>
                            <a href="#" class="text-xs text-scrow-green hover:underline">Lupa sandi?</a>
                        </div>
                        <input type="password" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-scrow-green focus:ring-4 focus:ring-green-50 transition" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full py-4 bg-scrow-green text-white font-bold rounded-xl hover:bg-green-800 transition shadow-lg shadow-green-100">Masuk ke Dashboard</button>
                </form>
            </div>
        </div>

        <!-- Langkah 2b: Form Login Buyer -->
        <div id="buyer-form" class="sub-page w-full max-w-md">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                <button onclick="showSelection()" class="text-gray-400 hover:text-gray-600 mb-6 flex items-center text-sm transition">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali ke pemilihan
                </button>
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-scrow-yellow text-green-900 rounded-xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-yellow-100">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Masuk Buyer</h2>
                    <p class="text-sm text-gray-400 mt-1">Cari stok bahan baku terbaik</p>
                </div>
                <!-- Redirect ke dashboard-buyer.html -->
                <form onsubmit="event.preventDefault(); window.location.href='products.html'" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Email atau Nomor HP</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-scrow-yellow focus:ring-4 focus:ring-yellow-50 transition" placeholder="johndoe@email.com" required>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-bold text-gray-700">Kata Sandi</label>
                            <a href="#" class="text-xs text-scrow-green hover:underline">Lupa sandi?</a>
                        </div>
                        <input type="password" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-scrow-yellow focus:ring-4 focus:ring-yellow-50 transition" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full py-4 bg-scrow-yellow text-green-900 font-bold rounded-xl hover:bg-yellow-500 transition shadow-lg shadow-yellow-100">Masuk ke Dashboard</button>
                </form>
            </div>
        </div>

    </main>

    <script>
        /**
         * Fungsi untuk menampilkan form login berdasarkan peran
         * @param {string} role - 'supplier' atau 'buyer'
         */
        function showLogin(role) {
            document.getElementById('selection').classList.remove('active');
            if(role === 'supplier') {
                document.getElementById('supplier-form').classList.add('active');
            } else {
                document.getElementById('buyer-form').classList.add('active');
            }
        }

        /**
         * Kembali ke layar pemilihan peran
         */
        function showSelection() {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('selection').classList.add('active');
        }
    </script>
</body>
</html>
