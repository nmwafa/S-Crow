<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - S+CROW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus+Jakarta+Sans', sans-serif; }
        .bg-scrow-green { background-color: #15803d; }
        .text-scrow-green { color: #15803d; }
        .bg-scrow-yellow { background-color: #facc15; }
        .text-scrow-yellow { color: #facc15; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="p-6">
        <a href="index.html" class="flex items-center space-x-2 max-w-7xl mx-auto">
            <div class="w-8 h-8 bg-scrow-green rounded flex items-center justify-center">
                <span class="text-scrow-yellow font-bold text-sm">S+</span>
            </div>
            <span class="text-xl font-bold tracking-tighter text-scrow-green">CROW</span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        
        <!-- Selection Step -->
        <div id="selection" class="sub-page active w-full max-w-4xl text-center">
            <h1 class="text-3xl font-bold mb-2">Mari Bergabung</h1>
            <p class="text-gray-500 mb-12">Pilih peran Anda untuk memulai perjalanan bisnis</p>
            <div class="grid md:grid-cols-2 gap-8">
                <button onclick="showRegister('supplier')" class="bg-scrow-green p-10 rounded-3xl shadow-lg border-2 border-transparent hover:scale-[1.02] transition text-left text-white">
                    <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-scrow-yellow text-3xl mb-6">
                        <i class="fas fa-truck-moving"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Daftar Supplier</h3>
                    <p class="text-green-100">Pasarkan produk Anda ke ribuan buyer dengan sistem pembayaran aman.</p>
                </button>
                <button onclick="showRegister('buyer')" class="bg-white p-10 rounded-3xl shadow-sm border-2 border-transparent hover:border-scrow-yellow hover:scale-[1.02] transition text-left">
                    <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center text-scrow-yellow text-3xl mb-6">
                        <i class="fas fa-store"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2 text-green-900">Daftar Buyer</h3>
                    <p class="text-gray-500">Dapatkan akses ke supplier tangan pertama dengan harga kompetitif.</p>
                </button>
            </div>
            <div class="mt-12">
                <p class="text-gray-500">Sudah punya akun? <a href="login.html" class="text-scrow-green font-bold">Masuk di sini</a></p>
            </div>
        </div>

        <!-- Supplier Register Form -->
        <div id="supplier-form" class="sub-page w-full max-w-2xl">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                <button onclick="showSelection()" class="text-gray-400 hover:text-gray-600 mb-6 flex items-center text-sm">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali
                </button>
                <h2 class="text-2xl font-bold mb-8">Pendaftaran Akun Supplier</h2>
                <form onsubmit="event.preventDefault(); alert('Pendaftaran Supplier Berhasil!')" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Nama Perusahaan</label>
                            <input type="text" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-green" placeholder="PT Maju Terus" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Nomor NIB</label>
                            <input type="text" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-green" placeholder="13 Digit NIB" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Email Bisnis</label>
                        <input type="email" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-green" placeholder="sales@perusahaan.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                        <input type="password" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-green" placeholder="Min. 8 karakter" required>
                    </div>
                    <button type="submit" class="w-full py-4 bg-scrow-green text-white font-bold rounded-xl shadow-lg">Daftar Sebagai Supplier</button>
                </form>
            </div>
        </div>

        <!-- Buyer Register Form -->
        <div id="buyer-form" class="sub-page w-full max-w-2xl">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                <button onclick="showSelection()" class="text-gray-400 hover:text-gray-600 mb-6 flex items-center text-sm">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali
                </button>
                <h2 class="text-2xl font-bold mb-8 text-green-900">Pendaftaran Akun Buyer</h2>
                <form onsubmit="event.preventDefault(); alert('Pendaftaran Buyer Berhasil!')" class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-yellow" placeholder="John Doe" required>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Nomor WhatsApp</label>
                            <input type="tel" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-yellow" placeholder="0812xxxx" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                            <input type="email" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-yellow" placeholder="johndoe@email.com" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                        <input type="password" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-scrow-yellow" placeholder="Min. 8 karakter" required>
                    </div>
                    <button type="submit" class="w-full py-4 bg-scrow-yellow text-green-900 font-bold rounded-xl shadow-lg">Daftar Sebagai Buyer</button>
                </form>
            </div>
        </div>

    </main>

    <script>
        function showRegister(role) {
            document.getElementById('selection').classList.remove('active');
            if(role === 'supplier') {
                document.getElementById('supplier-form').classList.add('active');
            } else {
                document.getElementById('buyer-form').classList.add('active');
            }
        }
        function showSelection() {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('selection').classList.add('active');
        }
    </script>
</body>
</html>
